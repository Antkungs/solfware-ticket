<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT Ticket — จัดการเคส</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Hallmark - component: it-ticket-admin - เข้าชุด palette เดียวกับฝั่งผู้ใช้ */
:root {
--color-paper:#eef3ef; --color-card:#ffffff; --color-ink:#17211c; --color-muted:#5f6d65;
--color-line:#dbe4dd; --color-accent:#06c755; --color-accent-press:#05a847; --color-accent-ink:#037d38;
--color-accent-soft:#e2f7ea; --color-danger:#cf3f42; --color-danger-soft:#fdeeee;
--color-warn-ink:#9a5b07; --color-warn-soft:#fdf3e0; --color-focus:#0b6bcb;
--color-info-ink:#0b5cab; --color-info-soft:#e7f1fb;
--font-ui:'Anuphan',-apple-system,'Noto Sans Thai',sans-serif;
--s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
--rad-s:10px; --rad-m:14px; --dur:140ms; --ease-out:cubic-bezier(0.2,0.8,0.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-ui);background:var(--color-paper);color:var(--color-ink);line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding:var(--s5) var(--s4) var(--s6)}
h1{font-size:20px;font-weight:700}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s4);flex-wrap:wrap}
.topbar .r{display:flex;gap:var(--s2);align-items:center}
button,select,input{font:inherit}
.btn{min-height:40px;padding:0 var(--s4);border:1.5px solid var(--color-line);border-radius:var(--rad-s);background:var(--color-card);color:var(--color-ink);font-size:14px;font-weight:600;cursor:pointer;transition:border-color var(--dur) var(--ease-out)}
.btn:hover{border-color:#b9c9bd}
.btn.primary{background:var(--color-accent);border-color:var(--color-accent);color:#fff}
.btn.primary:hover{background:var(--color-accent-press)}
.btn:disabled{opacity:0.55;cursor:default}
/* login */
#login{max-width:360px;margin:14vh auto 0;background:var(--color-card);border:1px solid var(--color-line);border-radius:var(--rad-m);padding:var(--s6);text-align:center}
#login h1{margin-bottom:var(--s2)}
#login p{color:var(--color-muted);font-size:14px;margin-bottom:var(--s4)}
#login input{width:100%;font-size:16px;border:1.5px solid var(--color-line);border-radius:var(--rad-s);padding:var(--s3) var(--s4);margin-bottom:var(--s3);text-align:center}
#login .err{color:var(--color-danger);font-size:13px;margin-top:var(--s2);display:none}
/* filter */
.filters{display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s3)}
.fchip{border:1.5px solid var(--color-line);background:var(--color-card);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--color-muted)}
.fchip.on{border-color:var(--color-accent);background:var(--color-accent-soft);color:var(--color-accent-ink)}
#search{flex:1;min-width:180px;border:1.5px solid var(--color-line);border-radius:999px;padding:6px 16px;font-size:14px}
/* layout */
#app{display:none}
.cols{display:grid;grid-template-columns:1fr;gap:var(--s4)}
@media(min-width:880px){.cols{grid-template-columns:minmax(380px,1fr) minmax(380px,1fr);align-items:start}}
/* list */
.tcard{background:var(--color-card);border:1px solid var(--color-line);border-radius:var(--rad-m);padding:var(--s3) var(--s4);margin-bottom:var(--s2);cursor:pointer;transition:border-color var(--dur) var(--ease-out)}
.tcard:hover{border-color:#b9c9bd}
.tcard.sel{border-color:var(--color-accent);box-shadow:0 0 0 1px var(--color-accent)}
.row1{display:flex;align-items:center;justify-content:space-between;gap:var(--s2)}
.no{font-weight:700;font-size:15px}
.badge{font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap}
.b-new{background:var(--color-warn-soft);color:var(--color-warn-ink)}
.b-ack,.b-doing{background:var(--color-info-soft);color:var(--color-info-ink)}
.b-wait{background:var(--color-danger-soft);color:var(--color-danger)}
.b-done{background:var(--color-accent-soft);color:var(--color-accent-ink)}
.b-closed{background:#eceff0;color:#5c686b}
.meta{font-size:12px;color:var(--color-muted)}
.sum{font-size:13px;margin:2px 0;overflow-wrap:anywhere}
.urg-สูง{color:var(--color-danger);font-weight:700}
.urg-กลาง{color:var(--color-warn-ink)}
.empty,.loading{padding:var(--s6);text-align:center;color:var(--color-muted);font-size:14px;background:var(--color-card);border:1px dashed var(--color-line);border-radius:var(--rad-m)}
/* detail */
.dcard{background:var(--color-card);border:1px solid var(--color-line);border-radius:var(--rad-m);padding:var(--s4);margin-bottom:var(--s3)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:var(--s1) var(--s3);font-size:14px;margin-top:var(--s3)}
.kv dt{color:var(--color-muted)}
.kv dd{overflow-wrap:anywhere}
.field{margin-bottom:var(--s3)}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:var(--s1)}
.field select,.field input[type=text],.field textarea{width:100%;border:1.5px solid var(--color-line);border-radius:var(--rad-s);padding:var(--s2) var(--s3);font-size:14px}
.field textarea{resize:vertical;min-height:64px}
.chk{display:flex;align-items:center;gap:var(--s2);font-size:14px;margin-bottom:var(--s3)}
.msg{font-size:13px;margin-top:var(--s2);display:none}
.msg.ok{color:var(--color-accent-ink)}
.msg.bad{color:var(--color-danger)}
.tl{list-style:none;margin-top:var(--s2)}
.tl li{position:relative;padding:0 0 var(--s3) var(--s5);border-left:2px solid var(--color-line);margin-left:7px}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:'';position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--color-accent);border:2px solid var(--color-card)}
.tl li.internal::before{background:var(--color-warn-ink)}
.tl .t{font-size:11px;color:var(--color-muted)}
.tl .k{font-size:12px;font-weight:600}
.tl .b{font-size:13px;overflow-wrap:anywhere}
.tl .b a{color:var(--color-focus)}
.hint{color:var(--color-muted);font-size:13px}
</style>
</head>
<body>
<div id="login">
<h1>IT Ticket — จัดการเคส</h1>
<p>ใส่รหัสทีม IT เพื่อเข้าระบบ</p>
<input type="password" id="pin" placeholder="รหัสทีม" autocomplete="current-password">
<button class="btn primary" style="width:100%" id="loginbtn">เข้าระบบ</button>
<div class="err" id="loginerr"></div>
</div>

<div class="wrap" id="app">
<div class="topbar">
<h1>IT Ticket — จัดการเคส</h1>
<div class="r">
<button class="btn" id="refresh">รีเฟรช</button>
<button class="btn" id="logout">ออกจากระบบ</button>
</div>
</div>
<div class="filters" id="filters">
<button class="fchip on" data-f="เปิดอยู่">เปิดอยู่</button>
<button class="fchip" data-f="ทั้งหมด">ทั้งหมด</button>
<button class="fchip" data-f="รอรับเรื่อง">รอรับเรื่อง</button>
<button class="fchip" data-f="กำลังดำเนินการ">กำลังดำเนินการ</button>
<button class="fchip" data-f="รอข้อมูลเพิ่มเติม">รอข้อมูลเพิ่มเติม</button>
<button class="fchip" data-f="เสร็จสิ้น">เสร็จสิ้น</button>
<button class="fchip" data-f="ปิดแล้ว">ปิดแล้ว</button>
<input id="search" type="text" placeholder="ค้นหา เลขที่ / ชื่อ / รายละเอียด">
</div>
<div class="cols">
<div id="list"><div class="loading">กำลังโหลด...</div></div>
<div id="detail"><div class="empty">เลือกเคสจากรายการด้านซ้ายเพื่อดู/จัดการ</div></div>
</div>
</div>

<script>
var GAS_URL = 'https://script.google.com/macros/s/AKfycbzj-m1zfMEMrPHb8N0SreOr8yxLM28CNuR3CbVtx5eucMOvcQTJH6Tdl-Z7fnsfqnTx/exec';
var STATUSES = ['รอรับเรื่อง', 'รับเรื่องแล้ว', 'กำลังดำเนินการ', 'รอข้อมูลเพิ่มเติม', 'เสร็จสิ้น', 'ปิดแล้ว'];
var OPEN_SET = ['รอรับเรื่อง', 'รับเรื่องแล้ว', 'กำลังดำเนินการ', 'รอข้อมูลเพิ่มเติม'];
var BADGE = { 'รอรับเรื่อง': 'b-new', 'รับเรื่องแล้ว': 'b-ack', 'กำลังดำเนินการ': 'b-doing', 'รอข้อมูลเพิ่มเติม': 'b-wait', 'เสร็จสิ้น': 'b-done', 'ปิดแล้ว': 'b-closed' };
var key = null;
var all = [];
var filter = 'เปิดอยู่';
var selNo = null;

function esc(s) {
  return ('' + (s == null ? '' : s)).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function badge(st) { return '<span class="badge ' + (BADGE[st] || 'b-closed') + '">' + esc(st) + '</span>'; }

// ----- login -----
try { key = localStorage.getItem('itkey'); } catch (e) {}
if (key) { enter(); }

document.getElementById('loginbtn').addEventListener('click', doLogin);
document.getElementById('pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });

function doLogin() {
  var pin = document.getElementById('pin').value.trim();
  if (!pin) return;
  var btn = document.getElementById('loginbtn');
  btn.disabled = true; btn.textContent = 'กำลังตรวจ...';
  fetch(GAS_URL + '?api=adminList&key=' + encodeURIComponent(pin))
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (!res.ok) throw new Error(res.error || 'รหัสไม่ถูกต้อง');
      key = pin;
      try { localStorage.setItem('itkey', pin); } catch (e) {}
      all = res.tickets;
      enter(true);
    })
    .catch(function (e) {
      var el = document.getElementById('loginerr');
      el.textContent = '' + (e.message || e); el.style.display = 'block';
    })
    .then(function () { btn.disabled = false; btn.textContent = 'เข้าระบบ'; });
}

function enter(haveData) {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  if (haveData) { renderList(); } else { load(); }
}

document.getElementById('logout').addEventListener('click', function () {
  try { localStorage.removeItem('itkey'); } catch (e) {}
  location.reload();
});
document.getElementById('refresh').addEventListener('click', load);
document.getElementById('search').addEventListener('input', renderList);
[].forEach.call(document.querySelectorAll('.fchip'), function (c) {
  c.addEventListener('click', function () {
    [].forEach.call(document.querySelectorAll('.fchip'), function (x) { x.classList.remove('on'); });
    c.classList.add('on');
    filter = c.dataset.f;
    renderList();
  });
});

function load() {
  document.getElementById('list').innerHTML = '<div class="loading">กำลังโหลด...</div>';
  fetch(GAS_URL + '?api=adminList&key=' + encodeURIComponent(key))
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (!res.ok) throw new Error(res.error || 'server error');
      all = res.tickets;
      renderList();
    })
    .catch(function (e) {
      document.getElementById('list').innerHTML = '<div class="empty">โหลดไม่สำเร็จ: ' + esc(e.message || e) + '</div>';
    });
}

function visible() {
  var q = document.getElementById('search').value.trim().toLowerCase();
  return all.filter(function (t) {
    if (filter === 'เปิดอยู่' && OPEN_SET.indexOf(t.status) === -1) return false;
    if (filter !== 'ทั้งหมด' && filter !== 'เปิดอยู่' && t.status !== filter) return false;
    if (q) {
      var hay = (t.no + ' ' + t.name + ' ' + t.category + ' ' + t.detail + ' ' + (t.note || '')).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });
}

function renderList() {
  var v = visible();
  var el = document.getElementById('list');
  if (!v.length) { el.innerHTML = '<div class="empty">ไม่มีเคสตามเงื่อนไขนี้</div>'; return; }
  el.innerHTML = v.map(function (t) {
    return '<div class="tcard' + (t.no === selNo ? ' sel' : '') + '" data-no="' + esc(t.no) + '">' +
      '<div class="row1"><span class="no">' + esc(t.no) + '</span>' + badge(t.status) + '</div>' +
      '<div class="sum">' + esc(t.category) + ' · ' + esc(t.detail).slice(0, 70) + '</div>' +
      '<div class="meta">' + esc(t.name) + ' · ' + esc(t.openedAt) +
      ' · <span class="urg-' + esc(t.urgency) + '">เร่งด่วน: ' + esc(t.urgency) + '</span>' +
      (t.note ? ' · ผู้รับผิดชอบ/โน้ต: ' + esc(t.note) : '') + '</div></div>';
  }).join('');
  [].forEach.call(el.querySelectorAll('.tcard'), function (c) {
    c.addEventListener('click', function () { openDetail(c.dataset.no); });
  });
}

function openDetail(no) {
  selNo = no;
  renderList();
  var t = all.filter(function (x) { return x.no === no; })[0];
  if (!t) return;
  var d = document.getElementById('detail');
  d.innerHTML =
    '<div class="dcard">' +
    '<div class="row1"><span class="no" style="font-size:17px">' + esc(t.no) + '</span>' + badge(t.status) + '</div>' +
    '<dl class="kv">' +
    '<dt>ผู้แจ้ง</dt><dd>' + esc(t.name) + '</dd>' +
    '<dt>ประเภท</dt><dd>' + esc(t.category) + '</dd>' +
    '<dt>รายละเอียด</dt><dd>' + esc(t.detail) + '</dd>' +
    '<dt>สถานที่</dt><dd>' + esc(t.location || '-') + '</dd>' +
    '<dt>ความเร่งด่วน</dt><dd class="urg-' + esc(t.urgency) + '">' + esc(t.urgency) + '</dd>' +
    '<dt>เปิดเมื่อ</dt><dd>' + esc(t.openedAt) + '</dd>' +
    '<dt>ปิดเมื่อ</dt><dd>' + esc(t.closedAt || '-') + '</dd>' +
    '</dl></div>' +
    '<div class="dcard">' +
    '<div class="field"><label for="f-status">เปลี่ยนสถานะ</label><select id="f-status">' +
    STATUSES.map(function (s) { return '<option' + (s === t.status ? ' selected' : '') + '>' + s + '</option>'; }).join('') +
    '</select></div>' +
    '<div class="field"><label for="f-assignee">ผู้รับผิดชอบ / โน้ตสั้น (แสดงในชีตคอลัมน์หมายเหตุ)</label>' +
    '<input type="text" id="f-assignee" value="' + esc(t.note || '') + '"></div>' +
    '<div class="field"><label for="f-note">โน้ตภายใน IT (ผู้แจ้งไม่เห็น)</label><textarea id="f-note"></textarea></div>' +
    '<div class="field"><label for="f-msg">ข้อความถึงผู้แจ้ง (ส่งทาง LINE, ไม่บังคับ)</label><textarea id="f-msg"></textarea></div>' +
    '<label class="chk"><input type="checkbox" id="f-notify" checked> แจ้งผู้แจ้งทาง LINE เมื่อบันทึก</label>' +
    '<button class="btn primary" id="savebtn" style="width:100%">บันทึก</button>' +
    '<div class="msg" id="savemsg"></div></div>' +
    '<div class="dcard"><div class="row1"><strong style="font-size:14px">ความเคลื่อนไหว</strong>' +
    '<span class="hint">จุดเหลือง = ภายใน IT</span></div><ul class="tl" id="tl"><li><span class="t">กำลังโหลด...</span></li></ul></div>';
  document.getElementById('savebtn').addEventListener('click', function () { save(t); });
  fetch(GAS_URL + '?api=adminDetail&key=' + encodeURIComponent(key) + '&no=' + encodeURIComponent(no))
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (!res.ok) throw new Error(res.error || 'server error');
      var items = [{ time: t.openedAt, kind: 'เปิดเคส', body: t.detail }].concat(res.updates);
      document.getElementById('tl').innerHTML = items.map(function (u) {
        var body = /^https?:\/\//.test(u.body)
          ? '<a href="' + esc(u.body) + '" target="_blank" rel="noopener">เปิดดูรูป/ลิงก์</a>' : esc(u.body);
        return '<li' + (u.kind === 'โน้ต IT' ? ' class="internal"' : '') + '><div class="t">' + esc(u.time) +
          '</div><div class="k">' + esc(u.kind) + '</div><div class="b">' + body + '</div></li>';
      }).join('');
    })
    .catch(function (e) {
      document.getElementById('tl').innerHTML = '<li><span class="t">โหลดไม่สำเร็จ: ' + esc(e.message || e) + '</span></li>';
    });
}

function save(t) {
  var btn = document.getElementById('savebtn');
  var msg = document.getElementById('savemsg');
  var newStatus = document.getElementById('f-status').value;
  var body = {
    action: 'adminUpdate', key: key, no: t.no,
    assignee: document.getElementById('f-assignee').value.trim(),
    note: document.getElementById('f-note').value.trim(),
    message: document.getElementById('f-msg').value.trim(),
    notify: document.getElementById('f-notify').checked
  };
  if (newStatus !== t.status) body.status = newStatus;
  btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
  msg.className = 'msg';
  fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (!res.ok) throw new Error(res.error || 'server error');
      msg.textContent = 'บันทึกแล้ว'; msg.className = 'msg ok'; msg.style.display = 'block';
      load();
      setTimeout(function () { openDetail(t.no); }, 400);
    })
    .catch(function (e) {
      msg.textContent = 'ผิดพลาด: ' + (e.message || e); msg.className = 'msg bad'; msg.style.display = 'block';
    })
    .then(function () { btn.disabled = false; btn.textContent = 'บันทึก'; });
}
</script>
</body>
</html>
